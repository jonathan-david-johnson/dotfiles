# Truecolor: advertise 24-bit color and enable RGB for the outer terminal (Ghostty).
# Without this, tmux reports RGB [missing] and apps fall back to 256-color, washing out themes.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ",xterm-ghostty:Tc"

set -g allow-passthrough on
set -s set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
set -g base-index 1
set -g renumber-windows on
# Tabs at the top, command/message line at the bottom.
# tmux draws the command prompt and messages on status line 0, at whatever
# position status-position sets. To keep tabs up top but the prompt at the
# bottom, we use a 2-line status bar positioned at the bottom:
#   line 0 (bottom row) -> reserved for the prompt/messages (kept blank)
#   line 1 (row above)  -> the real status bar with window tabs
# The actual format swap happens in a run hook AFTER catppuccin loads (below),
# because catppuccin rewrites status-format[0] when it initializes.
set -g status 2
set -g status-position bottom
set -g pane-border-indicators arrows
bind r source-file ~/.tmux.conf \; display "Reloaded"
bind P display-popup -E -d "#{pane_current_path}" -w 80% -h 80% "$SHELL"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g automatic-rename off
set -g allow-rename off
set -g popup-style "bg=#1e1e2e"
set -g popup-border-style "fg=#cba6f7,bg=#1e1e2e"
set -g popup-border-lines "rounded"
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Keep each tmux server's saved sessions separate by socket name.
# The default (personal) socket and the 'toshiba' (work) socket each get
# their own resurrect dir, so continuum never overwrites the other's 'last'
# save and Ctrl+b s never mixes personal and work sessions.
# resurrect reads @resurrect-dir literally (no #{} expansion), so we resolve
# the socket name here and store the concrete path.
# NOTE: must be set BEFORE the resurrect/continuum plugins are loaded below.
run 'tmux set-option -g @resurrect-dir "$HOME/.local/share/tmux/resurrect-$(tmux display-message -p "#{b:socket_path}")"'

run '~/.tmux/plugins/tmux/catppuccin.tmux'
run '~/.tmux/plugins/tpm/tpm'

# Keep line 0 completely empty for the prefix+: command prompt and messages.
# Build line 1 explicitly instead of copying line 0, so repeated config reloads
# cannot accidentally replace the window list with the environment label.
set -g status-format[0] ""
set -g status-format[1] '#{T:status-left}#{W:#{T:window-status-format},#{T:window-status-current-format}}#[align=right]#{T:status-right}'

# Show the environment at the left of the window-tab row. It cannot live on
# line 0 without occupying the same row tmux uses for command entry.
set -g status-left-length 40
set -g status-left '#[fg=#cdd6f4,bold] #{?#{==:#{b:socket_path},toshiba},TOSHIBA,PERSONAL} [#{session_name}] #[default]'

# Make the selected row obvious in choose-tree (prefix+s), copy mode, menus,
# and other tmux modes. Catppuccin's default surface color was too subtle.
set -g mode-style 'fg=#11111b,bg=#cba6f7,bold'
